[project]
name = "auto-clipper-backend"
version = "0.1.0"
description = "Podcast YouTube → Klip Vertikal Fokus Produk → Siap Post TikTok"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "sse-starlette>=2.2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "tenacity>=8.0",
    "yt-dlp>=2024.0",
    "faster-whisper>=1.0",
    "silero-vad>=5.0",
    "google-genai>=1.0",
    "anthropic>=0.30",
    "mediapipe>=0.10",
    "fonttools>=4.0",
    "ultralytics>=8.3",
    "pyannote.audio>=3.3",
]

[tool.setuptools.packages.find]
include = ["*"]

[tool.setuptools]
py-modules = ["config", "orchestrator", "runtime", "server"]
include-package-data = false

[tool.setuptools.package-data]
db = ["*.sql"]
prompts = ["*.txt"]
stages = ["reframe/*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
